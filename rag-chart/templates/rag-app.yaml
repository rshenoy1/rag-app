apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-app
  template:
    metadata:
      annotations:
        rollout-timestamp: "{{ now | date `20060102150405` }}"
      labels:
        app: rag-app
    spec:
      containers:
        - name: rag-app
          image: radioragapp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7860
          # 1. ADD THIS MOUNT BLOCK UNDER THE CONTAINER SETTINGS
          volumeMounts:
            - name: chroma-storage
              mountPath: /app/chroma_db
          # ----------------------------------------------------
          env:
            - name: GROQ_API_KEY
              value: {{ .Values.environment.groq_api_key | quote }}
            - name: HF_HOME
              value: {{ .Values.environment.hf_cache_dir | quote }}
            - name: CHROMA_SERVER_HOST
              value: "chromadb-service"
            - name: CHROMA_SERVER_HTTP_PORT
              value: "8000"
      # 2. ADD THIS VOLUMES BLOCK AT THE BOTTOM (ALIGNED WITH containers:)
      volumes:
        - name: chroma-storage
          hostPath:
            path: /run/desktop/mnt/host/c/rag/chroma_db
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: rag-app-service
spec:
  type: LoadBalancer
  selector:
    app: rag-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 7860
