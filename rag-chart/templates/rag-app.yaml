apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-app  # 1. Check this label string
  template:
    metadata:
      annotations:
        rollout-timestamp: "{{ now | date `20060102150405` }}"
      labels:
        app: rag-app  # 2. Check this label string
    spec:
      # ... rest of your deployment container settings ...
---
apiVersion: v1
kind: Service
metadata:
  name: rag-app-service
spec:
  type: NodePort
  selector:
    app: rag-app    # 👈 3. THIS MUST MATCH THE TWO LABELS ABOVE EXACTLY!
  ports:
    - protocol: TCP
      port: 7860
      targetPort: 7860
      nodePort: 30860
