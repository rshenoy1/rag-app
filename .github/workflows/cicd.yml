name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Target the local Docker Desktop cluster context directly
      - name: Set Kubernetes Context
        run: |
          kubectl config use-context docker-desktop

      # 2. Rebuild the core docker application image locally
      - name: Build Local Docker Image
        run: |
          docker build -t radioragapp:latest .

      # 3. Deploy via Helm, securely injecting the GitHub Secret at runtime
      - name: Deploy to Docker Desktop Kubernetes
        env:
          # Pulls the secret safely out of GitHub's encrypted vault
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          helm upgrade --install rag-release ./rag-chart \
            --set image.pullPolicy=Never \
            --set environment.groq_api_key="$GROQ_KEY" \
            --wait

      # 4. Verify pod health status
      - name: Verify App Status
        run: |
          kubectl get pods
