name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Local Paths
        run: |
          $env:Path += ";C:\Program Files\Docker\Docker\resources\bin"
          $env:Path += ";C:\Users\sheno\AppData\Local\Microsoft\WinGet\Packages\Helm.Helm_Microsoft.Winget.Source_8wekyb3d8bbwe\windows-amd64"
          $env:Path += ";C:\Users\sheno\AppData\Local\Microsoft\WindowsApps"

      - name: Build Local Docker Image
        run: |
          docker build --no-cache -t radioragapp:latest .

      # Fix: PowerShell forces a clean text conversion before handing it to Helm
      - name: Deploy to Docker Desktop Kubernetes
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          $CleanKey = "$env:GROQ_KEY".Trim()
          helm upgrade --install rag-release ./rag-chart --set image.pullPolicy=Never --set environment.groq_api_key="$CleanKey" --wait
