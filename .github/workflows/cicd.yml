name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Ensure we are explicitly targeting the Docker Desktop cluster context
      - name: Set Kubernetes Context
        run: |
          kubectl config use-context docker-desktop

      # 2. Rebuild the core docker application image locally
      - name: Build Local Docker Image
        run: |
          docker build -t radioragapp:latest .

      # 3. Deploy configuration via Helm using the local image policy
      - name: Deploy to Docker Desktop Kubernetes
        run: |
          helm upgrade --install rag-release ./rag-chart \
            --set image.pullPolicy=Never \
            --wait

      # 4. Verify pod health status
      - name: Verify App Status
        run: |
          kubectl get pods
